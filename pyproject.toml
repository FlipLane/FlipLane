[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fliplane"
version = "0.1.0"
description = "A local Python pipeline runner with lanes"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
fliplane = "fliplane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fliplane*"]
